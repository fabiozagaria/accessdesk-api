spring.application.name=access-desk-api

# Database predefinito quando non si specifica un profilo attivo
spring.profiles.default=postgres

# JPA / Hibernate — sviluppo locale
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Query SQL nel log
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security
security.jwt.secret=${SECRET_KEY}
