spring.application.name=access-desk-api

# Database predefinito quando non si specifica un profilo attivo
spring.profiles.default=postgres

# Lo schema è gestito da Flyway (migrazioni per database in db/migration/{vendor});
# Hibernate si limita a verificare che le entità corrispondano
spring.flyway.locations=classpath:db/migration/{vendor}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Query SQL nel log
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security
security.jwt.secret=${SECRET_KEY}
