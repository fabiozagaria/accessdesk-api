# Profilo demo: database H2 in memoria, pensato per la demo pubblica.
# I dati si perdono a ogni riavvio; gli utenti di prova vengono ricreati da DemoDataSeeder.
spring.datasource.url=jdbc:h2:mem:accessdesk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# H2 riusa le migrazioni PostgreSQL (nessuna copia da mantenere)
spring.flyway.locations=classpath:db/migration/postgresql

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Dietro il proxy di Render: schema https corretto nei link di Swagger
server.forward-headers-strategy=framework
server.port=${PORT:8080}

demo.password=${DEMO_PASSWORD:DemoPass2026}
